name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  database:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: 貼り付け用の schema.sql が最新か確認する
        run: |
          supabase/bundle.sh > /tmp/schema.sql
          if ! diff -q supabase/schema.sql /tmp/schema.sql > /dev/null; then
            echo "supabase/schema.sql が migrations/ とずれています。"
            echo "supabase/bundle.sh > supabase/schema.sql で作り直してください。"
            diff supabase/schema.sql /tmp/schema.sql | head -40
            exit 1
          fi

      - name: マイグレーションと RLS を検証する
        run: supabase/tests/run.sh
